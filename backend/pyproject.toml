[project]
name = "weathergpt-backend"
version = "1.0.0"
description = "Backend and meteorological processing core for WeatherGPT."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "geoalchemy2>=0.15,<1.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live PostgreSQL/PostGIS (set TEST_DATABASE_URL)",
]
asyncio_mode = "auto"
